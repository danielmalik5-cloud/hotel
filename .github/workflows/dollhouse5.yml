name: Draw five-floor dollhouse

# Draws two candidates of the hotel cutaway with a dining room (floor 3) and a rooftop terrace (floor 5),
# about 0.3 NIS, and sends them to Telegram for approval. Episodes keep the old drawing until approved.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pip install pillow numpy

      - name: Draw the candidates
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DOLLHOUSE_V2: "1"
          MAX_IMAGES: "2"
        run: python3 video.py

      - name: Save the new drawings
        run: |
          git config user.name "token-hotel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "Five-floor dollhouse candidates" || echo "Nothing new to save"
          git pull --rebase
          git push

      - name: Send to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          for k in 1 2; do
            p=videos/dollhouse_a5_$k.png
            [ -f "$p" ] || continue
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              -F chat_id="${CHAT_ID}" -F caption="New hotel, option $k (dining room + rooftop terrace)" -F photo=@"$p" > /dev/null
          done
