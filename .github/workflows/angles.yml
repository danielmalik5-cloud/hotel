name: Draw extra room angles

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  angles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Draw the extra angles
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANGLES: "1"
          MAX_IMAGES: "12"
        run: python3 video.py

      - name: Save the new drawings
        run: |
          git config user.name "token-hotel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "New room angles" || echo "Nothing new to save"
          git push

      - name: Send the preview to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F caption="Room angles: left = original, middle and right = new" \
            -F document=@videos/angles_preview.png > /dev/null
