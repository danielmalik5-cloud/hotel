name: Daily hotel episode

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (about 8:17 Israel time)
    - cron: "47 9 * * *"   # safety net at 09:47 UTC: runs only if today's episode is still missing
  workflow_dispatch: {}    # lets you also press a "Run" button by hand

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        name: Is today's episode already made?
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "transcripts/$(date -u +%F).json" ]; then
            echo "Today's episode already exists: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  episode:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate today's conversation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MAX_CALLS: "16"
          TURNS: "9"
        run: python3 engine.py

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow numpy

      - name: Make today's video
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DOLLHOUSE_EP: "1"
        run: |
          # moving opening twice a week: Monday and Thursday (about 2.5 NIS each time)
          case "$(date -u +%u)" in 1|4) export ANIMATE=1 ;; esac
          python3 video.py

      - name: Write the upload texts (YouTube and TikTok)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 package.py

      - name: Check the video quality
        continue-on-error: true
        env:
          QA: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 video.py

      - name: Keep the video for download
        uses: actions/upload-artifact@v4
        with:
          name: hotel-video
          path: videos/*.mp4
          retention-days: 14

      - name: Save the transcript
        if: always()
        run: |
          git config user.name "token-hotel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add transcripts assets
          git commit -m "New hotel episode" || echo "Nothing new to save"
          git pull --rebase || true
          git push

      - name: Send the video to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          f=$(ls -t videos/20*.mp4 | head -1)
          echo "Sending $f"
          curl -sS --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
            -F chat_id="${CHAT_ID}" \
            -F supports_streaming=true \
            -F width=1080 -F height=1920 \
            -F duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -d. -f1)" \
            -F caption="The Token Hotel - $(date -u +%F)" \
            -F reply_markup='{"inline_keyboard":[[{"text":"✅ Approve & upload to YouTube","callback_data":"up:'"$(date -u +%F)"'"}]]}' \
            -F video=@"$f" > /dev/null
          if [ -s videos/package.html ]; then
            curl -sS --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" -d parse_mode=HTML \
              --data-urlencode text="$(cat videos/package.html)" > /dev/null
          fi

      - name: Tell Telegram which viewer comment inspired the episode
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          if [ -s inspired.txt ]; then
            curl -sS --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              --data-urlencode text="$(cat inspired.txt)" > /dev/null
          fi

      - name: Warn on Telegram if the quality check found problems
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          if [ -s videos/qa.txt ]; then
            curl -sS --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              --data-urlencode text="$(cat videos/qa.txt)" > /dev/null
          fi

      - name: Tell Telegram if the daily run failed
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          curl -sS --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="The daily episode run failed ($(date -u +%F)). Claude can check the log." > /dev/null
