name: Daily hotel episode

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch: {}    # lets you also press a "Run" button by hand

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate today's conversation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_CALLS: "16"
          TURNS: "9"
        run: python3 engine.py

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Make today's video
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 video.py

      - name: Keep the video for download
        uses: actions/upload-artifact@v4
        with:
          name: hotel-video
          path: videos/*.mp4
          retention-days: 14

      - name: Save the transcript
        run: |
          git config user.name "token-hotel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add transcripts assets
          git commit -m "New hotel episode" || echo "Nothing new to save"
          git push

      - name: Send the video to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          f=$(ls -t videos/20*.mp4 | head -1)
          echo "Sending $f"
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
            -F chat_id="${CHAT_ID}" \
            -F supports_streaming=true \
            -F width=1080 -F height=1920 \
            -F duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -d. -f1)" \
            -F caption="The Token Hotel - $(date -u +%F)" \
            -F video=@"$f" > /dev/null
