name: Dollhouse episode 404

on:
  workflow_dispatch: {}

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the episode (the 404 story we approved)
        run: |
          mkdir -p transcripts
          cat > transcripts/2026-11-20.json <<'EOF'
          {
            "date": "2026-11-20",
            "title": "Room 404 Is Not Found",
            "situation": "Mr. Loop insists on checking into room 404, a room the hotel cannot find anywhere.",
            "guest": "Mr. Loop",
            "mock": false,
            "model": "claude-haiku-5-5",
            "lines": [
              {
                "speaker": "Mr. Loop",
                "role": "Guest",
                "line": "Hello. Hello. Hello. May I have the key to room 404, please?"
              },
              {
                "speaker": "Pierce",
                "role": "Porter",
                "line": "Sorry, sir, I checked the big room list twice, and there is no 404, so, sorry, welcome again."
              },
              {
                "speaker": "Mr. Loop",
                "role": "Guest",
                "line": "Hello. Hello. I booked 404 yesterday, sir, so may I please have the key? Hello."
              },
              {
                "speaker": "Pierce",
                "role": "Porter",
                "line": "The brass printer just coughed out a card saying the room does not exist. Sorry!"
              },
              {
                "speaker": "Vex",
                "role": "Bartender",
                "line": "Pierce, you want the room that isn't there, so here's a drink that tastes like it."
              },
              {
                "speaker": "Pierce",
                "role": "Porter",
                "line": "Sorry, Madame Halloran, sorry to interrupt your tea, but could you please take charge of room 404?"
              },
              {
                "speaker": "Madame Halloran",
                "role": "Manager",
                "line": "Mr. Loop, this is a respectable establishment, so kindly wait by the bar while I find your room."
              },
              {
                "speaker": "Mr. Loop",
                "role": "Guest",
                "line": "Hello. Hello. I will wait by the bar, madam. Hello, lamp. Pierce, the key to 404, please?"
              },
              {
                "speaker": "Vex",
                "role": "Bartender",
                "line": "The drinks lift sent a tray to 404 last winter, so try the hallway."
              },
              {
                "speaker": "Pierce",
                "role": "Porter",
                "line": "Sorry, sir, I'm going to the hallway now, and I'm very sorry if there's a door there, sorry!"
              },
              {
                "speaker": "Madame Halloran",
                "role": "Manager",
                "line": "Very well, Mr. Loop, the door is occupied now. Here is your key."
              },
              {
                "speaker": "Mr. Loop",
                "role": "Guest",
                "line": "Hello. Hello. Hello. Thank you, madam, room 404 is lovely, and the door is very polite. Hello."
              }
            ],
            "note": "Every line is generated by an AI agent. The episode plan is written by an AI editor."
          }
          EOF

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Make the video
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DAY: "2026-11-20"
          DOLLHOUSE_EP: "1"
        run: python3 video.py

      - name: Keep the video for download
        uses: actions/upload-artifact@v4
        with:
          name: dollhouse-episode-404
          path: videos/*.mp4
          retention-days: 14

      - name: Send the video to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          f=videos/dollhouse_ep_2026-11-20.mp4
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
            -F chat_id="${CHAT_ID}" \
            -F supports_streaming=true \
            -F width=1080 -F height=1920 \
            -F duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -d. -f1)" \
            -F caption="404 - dollhouse version" \
            -F video=@"$f" > /dev/null
