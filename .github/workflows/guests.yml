name: Draw new guests

# Draws the guests waiting for approval (NEW_GUESTS in video.py), about 3 images per guest,
# saves them and sends one preview sheet to Telegram. They are not used in episodes until approved.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow numpy

      - name: Draw the new guests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GUEST_PREVIEW: "1"
          MAX_IMAGES: "15"
        run: python3 video.py

      - name: Save the new drawings
        run: |
          git config user.name "token-hotel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "New guest drawings (waiting for approval)" || echo "Nothing new to save"
          git pull --rebase
          git push

      - name: Send the preview to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
        run: |
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F caption="New guests for approval: 1 Sir Hallucinate, 2 Lady Token, 3 The Twins, 4 Dr. Retry, 5 Miss Agentic" \
            -F document=@videos/guests_preview.png > /dev/null
