name: Re-render an episode

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Episode date to re-render (YYYY-MM-DD)"
        default: "2026-11-14"

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Make the video again from the saved episode
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DAY: ${{ github.event.inputs.day }}
          DOLLHOUSE_EP: "1"
        run: python3 video.py

      - name: Check the video quality
        continue-on-error: true
        env:
          QA: "1"
        run: python3 video.py

      - name: Keep the video for download
        uses: actions/upload-artifact@v4
        with:
          name: rerendered-video
          path: videos/*.mp4
          retention-days: 14

      - name: Send the video to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "8873549758"
          DAY: ${{ github.event.inputs.day }}
        run: |
          f=videos/${DAY}.mp4
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
            -F chat_id="${CHAT_ID}" \
            -F supports_streaming=true \
            -F width=1080 -F height=1920 \
            -F duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -d. -f1)" \
            -F caption="The Token Hotel ${DAY} - word-by-word captions" \
            -F video=@"$f" > /dev/null
          if [ -s videos/qa.txt ]; then
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              --data-urlencode text="$(cat videos/qa.txt)" > /dev/null
          fi
